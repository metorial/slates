services:
  postgres:
    image: postgres:16-alpine
    container_name: slates-hub-postgres
    restart: unless-stopped
    ports:
      - "45432:5432"
    environment:
      POSTGRES_USER: slates-hub
      POSTGRES_PASSWORD: slates-hub
      POSTGRES_DB: slates-hub
    volumes:
      - postgres_data2:/var/lib/postgresql/data
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slates-hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  redis:
    image: redis:7-alpine
    container_name: slates-hub-redis
    restart: unless-stopped
    ports:
      - "46379:6379"  # Non-standard port to avoid conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  object-storage:
    image: ghcr.io/metorial/object-storage:latest
    container_name: slates-hub-object-storage
    restart: unless-stopped
    ports:
      - "52010:52010"
    volumes:
      - object-store-data:/app/data
    environment:
      RUST_LOG: info
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${OBJECT_STORAGE_AWS_REGION}
      OBJECT_STORE__SERVER__HOST: 0.0.0.0
      OBJECT_STORE__SERVER__PORT: 52010
      OBJECT_STORE__BACKEND__TYPE: s3
      OBJECT_STORE__BACKEND__REGION: ${OBJECT_STORAGE_AWS_REGION}
      OBJECT_STORE__BACKEND__PHYSICAL_BUCKET: ${OBJECT_STORAGE_AWS_S3_BUCKET}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:52010/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  forge:
    image: ghcr.io/metorial/forge:latest
    container_name: slates-hub-forge
    restart: unless-stopped
    ports:
      - "52020:52020"
    environment:
      DATABASE_URL: postgresql://slates-hub:slates-hub@postgres:5432/forge
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEFAULT_PROVIDER: aws.code-build
      OBJECT_STORAGE_URL: http://object-storage:52010
      LOG_BUCKET_NAME: logs
      ARTIFACT_BUCKET_NAME: artifacts
      CODE_BUILD_AWS_REGION: ${CODE_BUILD_AWS_REGION:-}
      CODE_BUILD_AWS_ACCESS_KEY_ID: ${CODE_BUILD_AWS_ACCESS_KEY_ID:-}
      CODE_BUILD_AWS_SECRET_ACCESS_KEY: ${CODE_BUILD_AWS_SECRET_ACCESS_KEY:-}
      CODE_BUILD_PROJECT_NAME: ${CODE_BUILD_PROJECT_NAME:-}
      CODE_BUILD_ROLE_ARN: ${CODE_BUILD_ROLE_ARN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:52020/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  function-bay:
    image: ghcr.io/metorial/function-bay:latest
    container_name: slates-hub-function-bay
    restart: unless-stopped
    ports:
      - "52030:52030"
    environment:
      DATABASE_URL: postgresql://slates-hub:slates-hub@postgres:5432/function-bay
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER}
      OBJECT_STORAGE_URL: http://object-storage:52010
      BUNDLE_BUCKET_NAME: bundles
      FORGE_API_URL: http://forge:52020/metorial-forge
      LAMBDA_AWS_REGION: ${LAMBDA_AWS_REGION:-}
      LAMBDA_AWS_ACCESS_KEY_ID: ${LAMBDA_AWS_ACCESS_KEY_ID:-}
      LAMBDA_AWS_SECRET_ACCESS_KEY: ${LAMBDA_AWS_SECRET_ACCESS_KEY:-}
      LAMBDA_ROLE_ARN: ${LAMBDA_ROLE_ARN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      forge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:52030/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  signal:
    image: ghcr.io/metorial/signal:latest
    container_name: slates-hub-signal
    restart: unless-stopped
    ports:
      - "52050:52050"
    environment:
      DATABASE_URL: postgresql://slates-hub:slates-hub@postgres:5432/signal
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_URL: http://object-storage:52010
      LOGS_BUCKET_NAME: bundles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:52050/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  slates-registry:
    build:
      context: ../registry
      dockerfile: ../registry/dev.Dockerfile
    container_name: slates-hub-registry
    restart: unless-stopped
    ports:
      - "52040:52040"
      - "52041:52041"
    environment:
      DATABASE_URL: postgresql://slates-hub:slates-hub@postgres:5432/slates-registry
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_URL: http://object-storage:52010
      PACKAGE_BUCKET_NAME: slates-hub-packages
      SERVICE_PUBLIC_URL: http://localhost:52040
      PUBLIC_ACCESS_PERMITTED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:52040/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

volumes:
  postgres_data2:
    driver: local
  object-store-data:
    driver: local

networks:
  slates-hub-network:
    driver: bridge
