version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: slates-registry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slates-registry
      POSTGRES_PASSWORD: slates-registry
      POSTGRES_DB: slates-registry
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    networks:
      - slates-registry-network

  redis:
    image: redis:7-alpine
    container_name: slates-registry-redis
    restart: unless-stopped
    networks:
      - slates-registry-network

  object-storage:
    image: ghcr.io/metorial/object-storage:latest
    ports:
      - '52010:52010'
    volumes:
      - object-store-data:/app/data
    environment:
      RUST_LOG: info
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${OBJECT_STORAGE_AWS_REGION:-us-east-1}

      OBJECT_STORE__SERVER__HOST: 0.0.0.0
      OBJECT_STORE__SERVER__PORT: 52010
      OBJECT_STORE__BACKEND__TYPE: ${OBJECT_STORAGE_BACKEND_TYPE:-local}
      OBJECT_STORE__BACKEND__ROOT_PATH: ${OBJECT_STORAGE_BACKEND_ROOT_PATH:-/app/data}
      OBJECT_STORE__BACKEND__REGION: ${OBJECT_STORAGE_AWS_REGION:-us-east-1}
      OBJECT_STORE__BACKEND__PHYSICAL_BUCKET: ${OBJECT_STORAGE_AWS_S3_BUCKET:-slates-registry}

    container_name: slates-registry-object-storage
    restart: unless-stopped
    networks:
      - slates-registry-network

  slates-registry:
    build:
      context: ../..
      dockerfile: ./apps/registry/Dockerfile
      target: dev
    container_name: slates-registry-service
    restart: unless-stopped
    ports:
      - '52040:52040'
      - '52041:52041'
      - '52042:52042'
    environment:
      DATABASE_URL: postgresql://slates-registry:slates-registry@postgres:5432/slates-registry
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_URL: http://object-storage:52010
      PACKAGE_BUCKET_NAME: slates-registry-packages
      SERVICE_PUBLIC_URL: http://localhost:52040
      PUBLIC_ACCESS_PERMITTED: 'true'
    volumes:
      - ./src:/app/apps/registry/src:ro
      - ./package.json:/app/apps/registry/package.json:ro
      - ./tsconfig.json:/app/apps/registry/tsconfig.json:ro
    depends_on:
      - postgres
      - redis
      - object-storage
    networks:
      - slates-registry-network

volumes:
  postgres_data2:
    driver: local
  object-store-data:
    driver: local

networks:
  slates-registry-network:
    driver: bridge
